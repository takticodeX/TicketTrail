# Serves the single-page app and proxies /api to the backend, so the browser
# only ever talks to one origin (no CORS needed).

# HSTS only when the app is reached over HTTPS through the reverse proxy in front.
map $http_x_forwarded_proto $hsts {
    https   "max-age=31536000; includeSubDomains";
    default "";
}

# Written at start-up by /docker-entrypoint.d/15-resolver.sh (see docker-resolver.sh).
include /tmp/nginx/resolver.conf;

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    client_max_body_size 1m;

    # Headers for every response. Repeated below: a location's add_header replaces these.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Strict-Transport-Security $hsts always;

    location /api/ {
        # A variable makes Nginx resolve "api" per request rather than once at
        # start-up, so a recreated api container is found again.
        set $api_upstream http://api:8000;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Keep https from the proxy in front; otherwise this hop's scheme.
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 60s;
    }

    # Hashed build assets never change, so they can be cached for good.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security $hsts always;
    }

    # Client-side routes all fall back to index.html, which must not be cached.
    # The CSP covers the app only: /api/docs loads Swagger UI from a CDN.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
        add_header X-Frame-Options "DENY" always;
        add_header Strict-Transport-Security $hsts always;
    }
}
