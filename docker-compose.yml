# TicketTrail production-like stack. Start with: docker compose up -d
# (Podman: podman compose up -d). Copy .env.example to .env first; see README.md.
name: tickettrail

# The app containers run as non-root users with a read-only filesystem: only the
# repos_data volume (/data/repos) and an in-memory /tmp are writable (spec section 10).
x-hardened: &hardened
  read_only: true
  tmpfs:
    - /tmp
  security_opt:
    - no-new-privileges:true

x-backend: &backend
  <<: *hardened
  build: ./backend
  image: localhost/tickettrail-backend:latest
  env_file: .env
  restart: unless-stopped
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  frontend:
    <<: *hardened
    build: ./frontend
    image: localhost/tickettrail-frontend:latest
    restart: unless-stopped
    ports:
      - "${TT_HTTP_PORT:-8080}:8080"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  api:
    <<: *backend
    # Migrations run before the API starts; worker and scheduler wait for a healthy API.
    command: >-
      sh -c "alembic upgrade head &&
      exec uvicorn --factory app.main:create_app --host 0.0.0.0 --port 8000
      --proxy-headers --forwarded-allow-ips='*'"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  worker:
    <<: *backend
    command: celery -A app.worker.celery_app worker --loglevel=INFO --concurrency=2
    volumes:
      - repos_data:/data/repos
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      # $(hostname), not $HOSTNAME: dash (the image's /bin/sh) doesn't set that variable.
      test: ["CMD-SHELL", "celery -A app.worker.celery_app inspect ping -d celery@$$(hostname) --timeout 5"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 30s

  scheduler:
    <<: *backend
    # Celery Beat only ticks the dispatcher each minute; schedules live in the database.
    command: >-
      celery -A app.worker.celery_app beat --loglevel=INFO
      --schedule /tmp/celerybeat-schedule --pidfile /tmp/celerybeat.pid
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "kill -0 $$(cat /tmp/celerybeat.pid)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  db:
    image: docker.io/library/postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: tt
      POSTGRES_PASSWORD: tt
      POSTGRES_DB: tickettrail
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tt -d tickettrail"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: docker.io/library/redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pg_data:
  repos_data:
