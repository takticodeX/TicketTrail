[project]
name = "tickettrail"
version = "0.2.0"
description = "Posts Git commit messages as comments on the Azure DevOps work items they reference."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.32,<1",
    "sqlalchemy>=2.0.36,<2.1",
    "alembic>=1.14,<2",
    "psycopg[binary]>=3.2,<4",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.6,<3",
    "email-validator>=2.2,<3",
    "argon2-cffi>=23.1,<26",
    "pyjwt>=2.10,<3",
    "cryptography>=43,<47",
    "redis>=5.2,<7",
    "celery>=5.4,<6",
    "tzdata>=2024.2",
    "regex>=2024.11",
    "croniter>=5.0,<7",
    "gitpython>=3.1.43,<4",
    "httpx>=0.28,<1",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
    "pytest-cov>=6,<8",
    "httpx>=0.28,<1",
    "testcontainers[postgres]>=4.8,<5",
    "ruff>=0.8,<1",
    "mypy>=1.13,<2",
    "respx>=0.22,<1",
    "types-regex>=2026.9.29.20261017",
    "types-croniter>=6.2.4.20261006",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "integration: needs a container runtime (Postgres via testcontainers)",
]
filterwarnings = [
    # Starlette suggests the new httpx2 client for TestClient; httpx 0.28 still works.
    # Revisit when FastAPI's own docs switch over.
    "ignore:Using `httpx` with `starlette.testclient`",
]

[tool.coverage.run]
source = ["app"]
branch = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF", "N", "ASYNC"]
ignore = ["B008"]  # FastAPI dependencies are declared in argument defaults

[tool.ruff.lint.isort]
# The local alembic/ folder holds migrations; the import is the third-party package.
known-third-party = ["alembic"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S107", "S603", "S607"]
"alembic/**" = ["N999"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["app"]

[[tool.mypy.overrides]]
module = ["celery", "celery.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["app.worker.*"]
disallow_untyped_decorators = false
