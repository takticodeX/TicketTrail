# Development overrides: hot reload and exposed ports.
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up
name: tickettrail

services:
  frontend:
    build: !reset null
    image: docker.io/library/node:22-alpine
    working_dir: /app
    command: sh -c "npm ci --no-audit --no-fund && npm run dev -- --host 0.0.0.0 --port 8080"
    environment:
      VITE_API_PROXY: http://api:8000
      VITE_POLL: "1"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    healthcheck:
      disable: true

  api:
    command: >-
      sh -c "alembic upgrade head &&
      exec uvicorn --factory app.main:create_app --host 0.0.0.0 --port 8000 --reload --reload-dir /app/app"
    environment:
      WATCHFILES_FORCE_POLLING: "true"
    volumes:
      - ./backend/app:/app/app:ro
      - ./backend/alembic:/app/alembic:ro
    ports:
      - "127.0.0.1:8000:8000"

  worker:
    volumes:
      - ./backend/app:/app/app:ro
      - repos_data:/data/repos

  scheduler:
    volumes:
      - ./backend/app:/app/app:ro

  db:
    ports:
      - "127.0.0.1:5432:5432"

  redis:
    ports:
      - "127.0.0.1:6379:6379"

volumes:
  frontend_node_modules:
